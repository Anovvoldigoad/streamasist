plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streamoverlay.lite'
    compileSdk 37

    defaultConfig {
        applicationId 'com.streamoverlay.lite'
        minSdk 28
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
